name: Update CozyStack Dependencies

on:
  schedule:
    # Run weekly on Mondays at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch for dependency updates'
        required: false
        default: 'main'

env:
  GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}

jobs:
  update-cozystack-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ env.GITHUB_TOKEN }}

      - name: Install gh CLI
        run: |
          # gh CLI is pre-installed on GitHub Actions runners
          gh --version

      - name: Check upstream CozyStack for updates
        id: check-upstream
        run: |
          # Fetch all tags, filter to non-prerelease semver (no -alpha/-beta/-rc suffix),
          # then sort by semver and take the highest.
          LATEST_TAG=$(curl -s "https://api.github.com/repos/cozystack/cozystack/git/refs/tags" \
            | jq -r '.[].ref | ltrimstr("refs/tags/")' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "❌ Could not determine latest release tag"
            exit 1
          fi

          TAG_DATE=$(curl -s "https://api.github.com/repos/cozystack/cozystack/git/refs/tags/$LATEST_TAG" \
            | jq -r '.object.sha' \
            | xargs -I{} curl -s "https://api.github.com/repos/cozystack/cozystack/commits/{}" \
            | jq -r '.commit.committer.date // "unknown"')

          echo "upstream-tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "upstream-date=$TAG_DATE" >> $GITHUB_OUTPUT

          # Check if we are already pinned to this tag in the build workflow
          if grep -qF "default: '$LATEST_TAG'" .github/workflows/build-talos-images.yml; then
            echo "already-latest=true" >> $GITHUB_OUTPUT
            echo "✅ Already pinned to latest release: $LATEST_TAG"
          else
            echo "already-latest=false" >> $GITHUB_OUTPUT
            echo "🔄 New release available: $LATEST_TAG"
          fi

      - name: Clone and analyze upstream changes
        id: analyze-changes
        if: steps.check-upstream.outputs.already-latest == 'false'
        run: |
          # Clone at the new tag and show commits since the previous release tag
          NEW_TAG="${{ steps.check-upstream.outputs.upstream-tag }}"
          git clone --branch "$NEW_TAG" --depth 50 https://github.com/cozystack/cozystack.git upstream-temp
          cd upstream-temp

          PREV_TAG=$(git tag | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -2 | head -1)
          LOG_RANGE="${PREV_TAG:+$PREV_TAG..}HEAD"
          RECENT_COMMITS=$(git log $LOG_RANGE --oneline --max-count=20)

          # Write changelog for PR description
          cat > ../UPSTREAM_CHANGELOG.md << EOF
          ## Changes in $NEW_TAG${PREV_TAG:+ (since $PREV_TAG)}

          \`\`\`
          $RECENT_COMMITS
          \`\`\`
          EOF

          # Check for any breaking changes (simple heuristic)
          BREAKING_CHANGES=$(git log $LOG_RANGE --grep="BREAKING" --grep="breaking" --oneline || echo "")
          if [ -n "$BREAKING_CHANGES" ]; then
            echo "potential-breaking=true" >> $GITHUB_OUTPUT
            cat >> ../UPSTREAM_CHANGELOG.md << EOF
          
          ⚠️ **Potential Breaking Changes Detected:**
          
          \`\`\`
          $BREAKING_CHANGES
          \`\`\`
          EOF
          else
            echo "potential-breaking=false" >> $GITHUB_OUTPUT
          fi

          cd ..
          rm -rf upstream-temp

      - name: Create dependency update branch
        id: create-branch
        if: steps.check-upstream.outputs.already-latest == 'false'
        run: |
          BRANCH_NAME="auto-update/cozystack-${{ steps.check-upstream.outputs.upstream-tag }}"
          echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          git checkout -b "$BRANCH_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update workflow files with new upstream release tag
        if: steps.check-upstream.outputs.already-latest == 'false'
        run: |
          NEW_TAG="${{ steps.check-upstream.outputs.upstream-tag }}"

          # Replace whatever semver tag is currently the default cozystack_commit.
          # Matches:   default: 'v1.2.3'
          sed -i -E "s|(default: ')(v[0-9]+\.[0-9]+\.[0-9]+)(')|\1${NEW_TAG}\3|" \
            .github/workflows/build-talos-images.yml

          echo "✅ Pinned build workflow to release: $NEW_TAG"

      - name: Test upstream integration compatibility
        id: test-integration
        if: steps.check-upstream.outputs.already-latest == 'false'
        run: |
          git clone --branch "${{ steps.check-upstream.outputs.upstream-tag }}" --depth 1 \
            https://github.com/cozystack/cozystack.git test-upstream
          cd test-upstream

          echo "Testing patch compatibility with ${{ steps.check-upstream.outputs.upstream-tag }}..."
          PATCH_SUCCESS=true

          for patch in ../patches/*.patch; do
            if [ -f "$patch" ]; then
              echo "Testing $(basename "$patch")"
              if git apply --check "$patch"; then
                echo "✅ $(basename "$patch") applies cleanly"
              else
                echo "❌ $(basename "$patch") has conflicts"
                PATCH_SUCCESS=false
              fi
            fi
          done

          if [ "$PATCH_SUCCESS" = "true" ]; then
            echo "test-result=success" >> $GITHUB_OUTPUT
            echo "✅ All patches compatible with ${{ steps.check-upstream.outputs.upstream-tag }}"
          else
            echo "test-result=failure" >> $GITHUB_OUTPUT
            echo "❌ Patch conflicts detected with ${{ steps.check-upstream.outputs.upstream-tag }}"
          fi

          cd ..
          rm -rf test-upstream

      - name: Commit dependency updates
        if: steps.check-upstream.outputs.already-latest == 'false'
        run: |
          git add .github/workflows/build-talos-images.yml
          git commit -m "chore: update CozyStack upstream to ${{ steps.check-upstream.outputs.upstream-tag }}

          Auto-updated CozyStack release pin on $(date +%Y-%m-%d)

          Release: ${{ steps.check-upstream.outputs.upstream-tag }}
          Release date: ${{ steps.check-upstream.outputs.upstream-date }}
          Patch compatibility: ${{ steps.test-integration.outputs.test-result }}"

      - name: Push update branch
        if: steps.check-upstream.outputs.already-latest == 'false'
        run: |
          git push origin ${{ steps.create-branch.outputs.branch-name }}

      - name: Create Pull Request
        if: steps.check-upstream.outputs.already-latest == 'false'
        run: |
          # Prepare PR description
          cat > PR_DESCRIPTION.md << 'EOF'
          ## 🤖 Automated CozyStack Dependency Update

          This PR updates our CozyStack upstream release pin.

          **Changes:**
          - Release: `${{ steps.check-upstream.outputs.upstream-tag }}`
          - Released: `${{ steps.check-upstream.outputs.upstream-date }}`
          - Patch compatibility: **${{ steps.test-integration.outputs.test-result }}**

          EOF

          # Add changelog if available
          if [ -f UPSTREAM_CHANGELOG.md ]; then
            cat UPSTREAM_CHANGELOG.md >> PR_DESCRIPTION.md
          fi

          cat >> PR_DESCRIPTION.md << 'EOF'

          ## 🧪 Pre-flight Checks
          - [x] Latest non-prerelease release tag identified
          - [x] Patch compatibility tested
          EOF

          if [ "${{ steps.test-integration.outputs.test-result }}" = "success" ]; then
            echo "          - [x] All patches apply cleanly ✅" >> PR_DESCRIPTION.md
          else
            echo "          - [ ] ⚠️ **Patch conflicts detected - manual review required**" >> PR_DESCRIPTION.md
          fi

          cat >> PR_DESCRIPTION.md << 'EOF'

          ## 🚀 Next Steps
          1. Review the upstream changes above
          2. Verify CI pipeline passes with new upstream
          3. Test ARM64 build with new CozyStack version
          4. Merge when ready

          ---
          *This PR was automatically created by the dependency update workflow*
          EOF

          LABELS="dependencies,automated"
          DRAFT_FLAG=""

          if [ "${{ steps.analyze-changes.outputs.potential-breaking }}" = "true" ]; then
            LABELS="$LABELS,breaking-change"
            DRAFT_FLAG="--draft"
          fi

          if [ "${{ steps.test-integration.outputs.test-result }}" = "failure" ]; then
            LABELS="$LABELS,needs-manual-review"
            DRAFT_FLAG="--draft"
          fi

          gh pr create \
            --title "chore: update CozyStack upstream to ${{ steps.check-upstream.outputs.upstream-tag }}" \
            --body-file PR_DESCRIPTION.md \
            --head ${{ steps.create-branch.outputs.branch-name }} \
            --base ${{ github.event.inputs.target_branch || 'main' }} \
            --label "$LABELS" \
            $DRAFT_FLAG

          echo "✅ Pull request created successfully"

      - name: Report status
        run: |
          if [ "${{ steps.check-upstream.outputs.already-latest }}" = "true" ]; then
            echo "✅ No updates needed - already using latest upstream"
          else
            echo "🔄 Dependency update PR created"
            echo "- Branch: ${{ steps.create-branch.outputs.branch-name }}"  
            echo "- Upstream: ${{ steps.check-upstream.outputs.upstream-sha }}"
            echo "- Compatibility: ${{ steps.test-integration.outputs.test-result }}"
            
            # Add workflow summary
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🤖 CozyStack Dependency Update
          
          **Status:** Update PR created successfully
          
          **Details:**
          - **New upstream commit:** `${{ steps.check-upstream.outputs.upstream-sha }}`
          - **Branch:** `${{ steps.create-branch.outputs.branch-name }}`
          - **Patch compatibility:** ${{ steps.test-integration.outputs.test-result }} ✅
          
          **Next:** Review and merge the auto-created pull request.
          EOF
          fi
