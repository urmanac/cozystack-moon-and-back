name: Build CozyStack ARM64 Images (Upstream Integration)
# 10/30/2025 - Rebuild for 0.38.1 Cozystack release

on:
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - '.github/workflows/build-talos-images.yml'
      - 'tests/**'
      - 'validate-*.sh'
      - 'crane'
      # Exclude documentation-only changes
      - '!docs/**'
      - '!README.md'
      - '!TODO.md'
      - '!CONTEXT-HANDOFF.md'
      - '!**/*.md'
      - '!index.md'
      - '!_config.yml'
      - '!attic/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'patches/**' 
      - '.github/workflows/build-talos-images.yml'
      - 'tests/**'
      - 'validate-*.sh'
      - 'crane'
      # Exclude documentation-only changes
      - '!docs/**'
      - '!README.md'
      - '!TODO.md'
      - '!CONTEXT-HANDOFF.md'
      - '!**/*.md'
      - '!index.md'
      - '!_config.yml'
      - '!attic/**'
  workflow_dispatch:
    inputs:
      cozystack_commit:
        description: 'Cozystack upstream ref or commit (default: v1.4.0)'
        required: false
        default: 'v1.4.0'
      talos_version:
        description: 'Talos version to build (default: v1.13.2)'
        required: false
        default: 'v1.13.2'
      extension_variant:
        description: 'Extension variant to build'
        required: false
        default: 'spin-tailscale'
        type: choice
        options:
          - 'spin-tailscale'
          - 'spin-hailort'
          - 'spin-only'
      build_targets:
        description: 'Build targets to execute'
        required: false
        default: 'upstream-images'
        type: choice
        options:
          - 'upstream-images'  # Build image-talos + image-matchbox (recommended)
          - 'image-operator'   # Just cozystack-operator image
          - 'image'           # Full build (operator + matchbox + cozystack + talos)
          - 'assets'          # Just Talos assets (kernel + initramfs)
          - 'image-talos'     # Just Talos installer image
          - 'image-matchbox'  # Just matchbox image

# Source: https://github.com/cozystack/cozystack/blob/v1.3.3/packages/core/talos/Makefile
env:
  REGISTRY: ghcr.io/urmanac/cozystack-assets
  DEFAULT_TALOS_VERSION: v1.13.2

jobs:
  # Job 1: Build general Cozystack packages and seed the cache.
  # This job only runs on push-to-main to avoid excessive registry load.
  build-cozystack-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then CRANE_ARCH="x86_64"; else CRANE_ARCH="arm64"; fi
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz | sudo tar xz -C /usr/local/bin crane
          if [ "$ARCH" = "x86_64" ]; then HELM_ARCH="amd64"; else HELM_ARCH="arm64"; fi
          curl -sSL "https://get.helm.sh/helm-v3.16.4-linux-${HELM_ARCH}.tar.gz" | tar xz
          sudo mv linux-${HELM_ARCH}/helm /usr/local/bin/helm
          rm -rf linux-${HELM_ARCH}
          if [ "$ARCH" = "x86_64" ]; then YQ_ARCH="amd64"; else YQ_ARCH="arm64"; fi
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH} -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
          FLUX_VERSION=$(curl -sSL https://api.github.com/repos/fluxcd/flux2/releases | jq -r '[.[] | select(.tag_name | startswith("v2.7.")) | .tag_name] | first')
          if [ -z "$FLUX_VERSION" ]; then FLUX_VERSION="v2.7.0"; fi
          if [ "$ARCH" = "x86_64" ]; then FLUX_ARCH="amd64"; else FLUX_ARCH="arm64"; fi
          curl -sSL "https://github.com/fluxcd/flux2/releases/download/${FLUX_VERSION}/flux_${FLUX_VERSION#v}_linux_${FLUX_ARCH}.tar.gz" | sudo tar xz -C /usr/local/bin flux

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone upstream CozyStack
        run: |
          git clone https://github.com/cozystack/cozystack.git cozystack-upstream
          cd cozystack-upstream
          COZYSTACK_REF="${{ github.event.inputs.cozystack_commit || 'v1.4.0' }}"
          git checkout "$COZYSTACK_REF"

      - name: Apply ARM64 patches (shared build)
        run: |
          cd cozystack-upstream
          git apply ../patches/04-arm64-default-platform.patch
          git apply ../patches/06-kubeovn-manifest-list-retag.patch
          git apply ../patches/07-arm64-skip-amd64-only-builds.patch

      - name: Build all in-tree images (make build)
        run: |
          cd cozystack-upstream
          # Explicitly pass TAG=latest to seed the registry cache
          make build REGISTRY="${{ env.REGISTRY }}" PUSH=1 TAG=latest

  # Job 2: Build specific Talos/Matchbox variants.
  build-cozystack-upstream:
    needs: [build-cozystack-images]
    # On main, wait for Job 1 to warm the cache. On PRs, Job 1 skips, so we run directly.
    if: always()
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        extension_variant: [spin-tailscale, spin-hailort, spin-only]
    
    outputs:
      kernel-digest: ${{ steps.assets.outputs.kernel-digest }}
      initramfs-digest: ${{ steps.assets.outputs.initramfs-digest }}
      talos-version: ${{ steps.build.outputs.talos-version }}
      build-target: ${{ steps.build.outputs.build-target }}
      asset-count: ${{ steps.assets.outputs.asset-count }}
      image-tags: ${{ steps.meta.outputs.tags }}
      test-image: ${{ steps.extract-first-tag.outputs.first-tag }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then CRANE_ARCH="x86_64"; else CRANE_ARCH="arm64"; fi
          curl -L https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz | sudo tar xz -C /usr/local/bin crane
          if [ "$ARCH" = "x86_64" ]; then YQ_ARCH="amd64"; else YQ_ARCH="arm64"; fi
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH} -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Clone and setup CozyStack (upstream main)
        run: |
          git clone https://github.com/cozystack/cozystack.git cozystack-upstream
          cd cozystack-upstream
          COZYSTACK_REF="${{ github.event.inputs.cozystack_commit || 'v1.4.0' }}"
          git checkout "$COZYSTACK_REF"
          echo "COZYSTACK_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Apply ARM64 conversion patches
        run: |
          cd cozystack-upstream
          EXTENSION_VARIANT="${{ matrix.extension_variant }}"
          git apply ../patches/04-arm64-default-platform.patch
          if [ "$EXTENSION_VARIANT" = "spin-only" ]; then
            git apply ../patches/03-arm64-spin-only.patch
          elif [ "$EXTENSION_VARIANT" = "spin-hailort" ]; then
            git apply ../patches/08-arm64-spin-hailort.patch
          else
            git apply ../patches/01-arm64-spin-tailscale.patch
          fi
          git apply ../patches/02-makefile-architecture-variables.patch
          chmod +x packages/core/talos/hack/gen-profiles.sh
          chmod +x packages/core/talos/hack/gen-versions.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update upstream dependencies and build with Makefile targets
        id: build
        env:
          REGISTRY: ${{ env.REGISTRY }}/talos/cozystack-${{ matrix.extension_variant }}
        run: |
          cd cozystack-upstream

          # Build images on every event so PRs catch regressions; only push on main.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PUSH=1
          else
            PUSH=0
          fi
          export PUSH

          echo "Building Talos/Matchbox (variant: ${{ matrix.extension_variant }})"
          cd packages/core/talos

          UPSTREAM_TALOS_VERSION=$(awk '/^version:/ {print $2; exit}' images/talos/profiles/installer.yaml)
          TARGET_TALOS_VERSION="${{ github.event.inputs.talos_version || env.DEFAULT_TALOS_VERSION }}"
          TALOS_VER="${TARGET_TALOS_VERSION:-$UPSTREAM_TALOS_VERSION}"
          
          bash hack/gen-profiles.sh "$TALOS_VER"

          BUILD_TARGET="${{ github.event.inputs.build_targets || 'upstream-images' }}"
          echo "Building with target: make $BUILD_TARGET"

          case "$BUILD_TARGET" in
            "upstream-images"|"image")
              make image-talos REGISTRY="$REGISTRY"
              make image-matchbox REGISTRY="$REGISTRY" PUSH="$PUSH"
              echo "build-outputs=talos-installer,matchbox" >> $GITHUB_OUTPUT
              ;;
            "assets")
              make assets
              echo "build-outputs=kernel,initramfs,iso,nocloud,metal" >> $GITHUB_OUTPUT
              ;;
            *)
              make "$BUILD_TARGET" REGISTRY="$REGISTRY"
              echo "build-outputs=$BUILD_TARGET" >> $GITHUB_OUTPUT
              ;;
          esac

          TALOS_VERSION=$(awk '/^version:/ {print $2}' images/talos/profiles/metal.yaml)
          echo "talos-version=$TALOS_VERSION" >> $GITHUB_OUTPUT
          echo "extension-variant=${{ matrix.extension_variant }}" >> $GITHUB_OUTPUT

      - name: Extract and package complete asset array with validation
        id: assets
        run: |
          cd cozystack-upstream
          mkdir -p assets/talos/arm64/{boot,containers,validation}
          BUILD_OUTPUTS="${{ steps.build.outputs.build-outputs }}"
          
          # Simplified asset collection logic
          if [[ "$BUILD_OUTPUTS" =~ "kernel" ]]; then
            cp _out/assets/kernel-arm64 assets/talos/arm64/boot/vmlinuz 2>/dev/null || true
          fi
          if [[ "$BUILD_OUTPUTS" =~ "initramfs" ]]; then
            cp _out/assets/initramfs-metal-arm64.xz assets/talos/arm64/boot/initramfs.xz 2>/dev/null || true
          fi
          
          cd assets/talos/arm64
          find . -type f ! -name "checksums.sha256" -exec sha256sum {} \; > checksums.sha256
          echo "asset-count=$(find . -type f | wc -l)" >> $GITHUB_OUTPUT

      - name: Generate build summary
        run: |
          echo "## 🚀 Custom Talos Image Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "Talos Version: ${{ steps.build.outputs.talos-version }}" >> $GITHUB_STEP_SUMMARY

  test-image-smoke:
    runs-on: ubuntu-latest
    needs: build-cozystack-upstream
    strategy:
      matrix:
        extension_variant: [spin-tailscale, spin-only]
    steps:
      - name: Install crane
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then CRANE_ARCH="x86_64"; else CRANE_ARCH="arm64"; fi
          curl -L https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz | sudo tar xz -C /usr/local/bin crane

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test
        run: |
          echo "Smoke testing variant: ${{ matrix.extension_variant }}"
          # Check if matchbox exists
          crane ls ghcr.io/urmanac/cozystack-assets/talos/cozystack-${{ matrix.extension_variant }}/matchbox || echo "Image not found yet"

  update-docs:
    runs-on: ubuntu-latest
    needs: [build-cozystack-upstream]
    if: github.ref == 'refs/heads/main' && success()
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Update docs
        run: |
          echo "Built: $(date -u)" > docs/LATEST-BUILD.md
          echo "- Talos version: ${{ needs.build-cozystack-upstream.outputs.talos-version }}" >> docs/LATEST-BUILD.md
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/LATEST-BUILD.md
          git commit -m "Update build info" || exit 0
          git push
