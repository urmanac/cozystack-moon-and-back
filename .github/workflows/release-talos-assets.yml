name: Release Talos Metal Image

# Triggered when a semver tag is pushed to this repo (e.g. v1.3.3).
# Produces:
#   - talos-metal-arm64.raw.xz  — raw disk image for dd / Raspberry Pi Imager
#   - talos-metal-arm64.raw.xz.sha256  — checksum
# and retags the existing GHCR OCI images with the release tag.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io/urmanac/cozystack-assets

jobs:
  # Stage 1: build all in-tree CozyStack images as linux/arm64 and push to our
  # registry. This is a single (non-matrix) job because nothing besides
  # core/talos varies by extension variant. Patches:
  #   04 — set PLATFORM ?= linux/arm64 (every docker buildx defaults to arm64)
  #   06 — add kubeovn image target that copies the upstream multi-arch
  #        manifest list and rewrites values.yaml to our registry
  #   07 — skip dashboard (amd64-hardcoded in its Dockerfile) and core/talos
  #        (handled per-variant in build-talos-variants)
  #
  # `make build` cascades through every in-tree package's `make image` target
  # which both (a) builds and pushes the image and (b) rewrites the chart's
  # values.yaml to reference $(REGISTRY). The final step builds the
  # cozystack-operator with the rewritten chart bundle baked in, so the
  # ExternalArtifacts the operator serves at runtime point at our registry.
  build-cozystack-images:
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then CRANE_ARCH="x86_64"; else CRANE_ARCH="arm64"; fi
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz \
            | sudo tar xz -C /usr/local/bin crane
          if [ "$ARCH" = "x86_64" ]; then HELM_ARCH="amd64"; else HELM_ARCH="arm64"; fi
          curl -sSL "https://get.helm.sh/helm-v3.16.4-linux-${HELM_ARCH}.tar.gz" \
            | tar xz
          sudo mv linux-${HELM_ARCH}/helm /usr/local/bin/helm
          rm -rf linux-${HELM_ARCH}
          if [ "$ARCH" = "x86_64" ]; then YQ_ARCH="amd64"; else YQ_ARCH="arm64"; fi
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH} -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
          crane version && yq --version && helm version --short

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io \
            --username ${{ github.actor }} --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            --username ${{ github.actor }} --password-stdin

      - name: Clone upstream CozyStack
        run: |
          COZYSTACK_REF=$(grep -oP "default: '(v[0-9]+\.[0-9]+\.[0-9]+)'" \
            .github/workflows/build-talos-images.yml | head -1 | grep -oP "v[0-9]+\.[0-9]+\.[0-9]+")
          echo "Building CozyStack images from $COZYSTACK_REF"
          echo "COZYSTACK_REF=$COZYSTACK_REF" >> $GITHUB_ENV
          git clone --branch "$COZYSTACK_REF" --depth 1 \
            https://github.com/cozystack/cozystack.git cozystack-upstream

      - name: Apply ARM64 patches (shared build)
        run: |
          cd cozystack-upstream
          git apply ../patches/04-arm64-default-platform.patch
          git apply ../patches/06-kubeovn-manifest-list-retag.patch
          git apply ../patches/07-arm64-skip-amd64-only-builds.patch
          echo "Patches applied:"
          git status --porcelain

      - name: Build all in-tree images (make build)
        run: |
          cd cozystack-upstream
          # `make build` runs every per-package `make image` target. Each one
          # docker buildx builds for linux/arm64 (patch 04), pushes to our
          # registry, and rewrites that chart's values.yaml. The final
          # core/installer build packages the rewritten charts into the
          # cozystack-operator image.
          make build REGISTRY="${{ env.REGISTRY }}" PUSH=1

  # Stage 2: per-variant talos installer + matchbox images. These are the only
  # images that genuinely differ between spin-tailscale and spin-only because
  # the extension list is baked into the talos installer at build time.
  build-talos-variants:
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        extension_variant: [spin-tailscale, spin-only]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then CRANE_ARCH="x86_64"; else CRANE_ARCH="arm64"; fi
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz \
            | sudo tar xz -C /usr/local/bin crane
          if [ "$ARCH" = "x86_64" ]; then YQ_ARCH="amd64"; else YQ_ARCH="arm64"; fi
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH} -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
          crane version && yq --version

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io \
            --username ${{ github.actor }} --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            --username ${{ github.actor }} --password-stdin

      - name: Clone upstream CozyStack
        run: |
          COZYSTACK_REF=$(grep -oP "default: '(v[0-9]+\.[0-9]+\.[0-9]+)'" \
            .github/workflows/build-talos-images.yml | head -1 | grep -oP "v[0-9]+\.[0-9]+\.[0-9]+")
          echo "Building talos variant ${{ matrix.extension_variant }} from CozyStack $COZYSTACK_REF"
          echo "COZYSTACK_REF=$COZYSTACK_REF" >> $GITHUB_ENV
          git clone --branch "$COZYSTACK_REF" --depth 1 \
            https://github.com/cozystack/cozystack.git cozystack-upstream

      - name: Apply ARM64 + variant patches
        run: |
          cd cozystack-upstream
          EXTENSION_VARIANT="${{ matrix.extension_variant }}"
          git apply ../patches/04-arm64-default-platform.patch
          if [ "$EXTENSION_VARIANT" = "spin-only" ]; then
            git apply ../patches/03-arm64-spin-only.patch
          else
            git apply ../patches/01-arm64-spin-tailscale.patch
          fi
          git apply ../patches/02-makefile-architecture-variables.patch
          chmod +x packages/core/talos/hack/gen-profiles.sh
          chmod +x packages/core/talos/hack/gen-versions.sh

      - name: Build and push talos + matchbox
        run: |
          cd cozystack-upstream/packages/core/talos
          UPSTREAM_TALOS_VERSION=$(awk '/^version:/ {print $2; exit}' images/talos/profiles/installer.yaml)
          if [ -z "$UPSTREAM_TALOS_VERSION" ]; then
            echo "::error::Could not derive Talos version from upstream installer.yaml"
            exit 1
          fi
          echo "Upstream-pinned Talos version: $UPSTREAM_TALOS_VERSION"
          bash hack/gen-profiles.sh "$UPSTREAM_TALOS_VERSION"
          VARIANT_REGISTRY="${{ env.REGISTRY }}/talos/cozystack-${{ matrix.extension_variant }}"

          echo "Building talos installer image (REGISTRY=$VARIANT_REGISTRY)..."
          make image-talos REGISTRY="$VARIANT_REGISTRY"

          echo "Building matchbox image (REGISTRY=$VARIANT_REGISTRY)..."
          make image-matchbox REGISTRY="$VARIANT_REGISTRY" PUSH=1

  build-metal-image:
    needs: [build-cozystack-images, build-talos-variants]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write    # create GitHub Release + upload assets
      packages: write    # retag OCI images in GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq xz-utils
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then CRANE_ARCH="x86_64"; else CRANE_ARCH="arm64"; fi
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz \
            | sudo tar xz -C /usr/local/bin crane
          if [ "$ARCH" = "x86_64" ]; then YQ_ARCH="amd64"; else YQ_ARCH="arm64"; fi
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH} -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
          crane version && yq --version

      - name: Clone upstream CozyStack
        run: |
          # Derive the pinned cozystack ref from build-talos-images.yml
          COZYSTACK_REF=$(grep -oP "default: '(v[0-9]+\.[0-9]+\.[0-9]+)'" \
            .github/workflows/build-talos-images.yml | head -1 | grep -oP "v[0-9]+\.[0-9]+\.[0-9]+")
          echo "Building from CozyStack $COZYSTACK_REF"
          echo "COZYSTACK_REF=$COZYSTACK_REF" >> $GITHUB_ENV
          git clone --branch "$COZYSTACK_REF" --depth 1 \
            https://github.com/cozystack/cozystack.git cozystack-upstream

      - name: Apply spin-only ARM64 patches
        run: |
          cd cozystack-upstream
          git apply ../patches/04-arm64-default-platform.patch
          git apply ../patches/03-arm64-spin-only.patch
          git apply ../patches/02-makefile-architecture-variables.patch
          chmod +x packages/core/talos/hack/gen-profiles.sh
          chmod +x packages/core/talos/hack/gen-versions.sh
          echo "Patches applied:"
          git status --porcelain

      - name: Build Talos metal image
        run: |
          cd cozystack-upstream/packages/core/talos

          # Pin Talos version to the upstream-committed profile (matches whatever
          # CozyStack release we're tracking). See build-talos-images.yml for the
          # rationale — gen-profiles.sh would otherwise pick latest upstream tag.
          UPSTREAM_TALOS_VERSION=$(awk '/^version:/ {print $2; exit}' images/talos/profiles/installer.yaml)
          if [ -z "$UPSTREAM_TALOS_VERSION" ]; then
            echo "::error::Could not derive Talos version from upstream installer.yaml"
            exit 1
          fi
          echo "Upstream-pinned Talos version: $UPSTREAM_TALOS_VERSION"
          bash hack/gen-profiles.sh "$UPSTREAM_TALOS_VERSION"

          echo "Generated profile:"
          cat images/talos/profiles/metal.yaml
          TALOS_VERSION=$(awk '/^version:/ {print $2; exit}' images/talos/profiles/metal.yaml)
          if [ "$TALOS_VERSION" != "$UPSTREAM_TALOS_VERSION" ]; then
            echo "::error::Regenerated metal.yaml has $TALOS_VERSION but expected $UPSTREAM_TALOS_VERSION"
            exit 1
          fi
          echo "TALOS_VERSION=$TALOS_VERSION" >> $GITHUB_ENV
          # Build raw disk images (metal, nocloud, iso, etc.)
          make assets

      - name: Collect release artifacts
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          # Composite version string: the raw image is a Talos image with the
          # CozyStack-derived ARM64 patches applied. It contains no CozyStack
          # itself, so naming it solely by the CozyStack release tag would be
          # misleading. Encode both: talos-<TALOS_VERSION>-cozy-<RELEASE_TAG>.
          ARTIFACT_VER="talos-${TALOS_VERSION}-cozy-${RELEASE_TAG}"
          echo "ARTIFACT_VER=$ARTIFACT_VER" >> $GITHUB_ENV
          mkdir -p release-artifacts

          # metal raw image — primary artifact for dd / Raspberry Pi Imager
          # Built with spin-only extensions baked in (Spin runtime, no Tailscale).
          if [ -f cozystack-upstream/_out/assets/metal-arm64.raw.xz ]; then
            cp cozystack-upstream/_out/assets/metal-arm64.raw.xz \
              "release-artifacts/talos-metal-arm64-spin-only-${ARTIFACT_VER}.raw.xz"
            echo "✅ metal-arm64.raw.xz collected (spin-only variant, ${ARTIFACT_VER})"
          else
            echo "❌ metal-arm64.raw.xz not found in _out/assets/"
            ls cozystack-upstream/_out/assets/ || true
            exit 1
          fi

          # Optional: nocloud image (useful for cloud/VM testing), also spin-only variant
          if [ -f cozystack-upstream/_out/assets/nocloud-arm64.raw.xz ]; then
            cp cozystack-upstream/_out/assets/nocloud-arm64.raw.xz \
              "release-artifacts/talos-nocloud-arm64-spin-only-${ARTIFACT_VER}.raw.xz"
            echo "✅ nocloud-arm64.raw.xz collected (spin-only variant, ${ARTIFACT_VER})"
          fi

          # Checksums
          cd release-artifacts
          sha256sum * > SHA256SUMS
          echo "Release artifacts:"
          ls -lh .

      - name: Tag GHCR OCI images at release
        run: |
          # Tagging direction: always retag FROM an immutable canonical tag
          # (built by build-talos-images.yml against the same CozyStack ref,
          # so the upstream Makefile produces matchbox:$(TAG) and
          # matchbox:$(TALOS_VERSION)-$(TAG) where TAG=v1.3.3). We then
          # alias :latest from that canonical tag.
          #
          # The prior implementation read FROM :latest, which is mutable and
          # could alias stale digests into the release composite tag. See
          # docs/ION-7-ORBITAL-REBOOT.md "Release tag drift bug".
          RELEASE_TAG="${{ github.ref_name }}"
          # TALOS_VERSION was written to GITHUB_ENV by the build step
          TALOS_VERSION="$TALOS_VERSION"
          # Canonical immutable matchbox tag produced by upstream Makefile when
          # cozystack-upstream HEAD is at the v1.3.3 git tag:
          #   matchbox:$(TALOS_VERSION)-$(TAG)  →  matchbox:v1.12.7-v1.3.3
          MATCHBOX_CANONICAL_TAG="${TALOS_VERSION}-${RELEASE_TAG}"
          # Composite tag: ties the matchbox image to both the Talos version it embeds
          # and the CozyStack repo release that produced it.
          MATCHBOX_TAG="talos-${TALOS_VERSION}-cozy-${RELEASE_TAG}"
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io \
            --username ${{ github.actor }} --password-stdin

          # Talos installer image:
          #   Already tagged by the upstream Makefile with the Talos version (e.g. v1.13.2).
          #   No additional tag — callers should pin by Talos version directly.
          echo "ℹ️  Talos installer images already carry Talos version tag (${TALOS_VERSION}) — not adding repo release tag."

          # Matchbox image:
          #   Retag the canonical immutable tag onto the composite tag, then alias
          #   :latest from the same canonical source so :latest always reflects the
          #   most recently released bits.
          for VARIANT in spin-tailscale spin-only; do
            BASE="${{ env.REGISTRY }}/talos/cozystack-${VARIANT}"
            SRC="${BASE}/matchbox:${MATCHBOX_CANONICAL_TAG}"
            echo "Tagging ${SRC} → :${MATCHBOX_TAG}"
            if crane tag "${SRC}" "${MATCHBOX_TAG}"; then
              echo "✅ ${VARIANT}/matchbox tagged ${MATCHBOX_TAG}"
              echo "Tagging ${SRC} → :latest"
              crane tag "${SRC}" latest \
                && echo "✅ ${VARIANT}/matchbox latest now points to ${MATCHBOX_CANONICAL_TAG}" \
                || echo "⚠️  Could not retag ${VARIANT}/matchbox to :latest"
            else
              echo "⚠️  Canonical source tag ${SRC} not found — build-talos-images.yml must run first"
            fi
          done

          # Operator: canonical immutable tag is :v1.3.3 (the CozyStack ref the
          # build was performed against). Alias :latest from that tag.
          OPERATOR_SRC="${{ env.REGISTRY }}/cozystack-operator:${RELEASE_TAG}"
          if crane digest "${OPERATOR_SRC}" >/dev/null 2>&1; then
            echo "✅ operator canonical tag ${RELEASE_TAG} already present"
            echo "Tagging ${OPERATOR_SRC} → :latest"
            crane tag "${OPERATOR_SRC}" latest \
              && echo "✅ operator :latest now points to ${RELEASE_TAG}" \
              || echo "⚠️  Could not retag operator to :latest"
          else
            echo "⚠️  Canonical source ${OPERATOR_SRC} not found — build-talos-images.yml must run first"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          TALOS_VER="${TALOS_VERSION}"
          COZYSTACK_VER="${COZYSTACK_REF}"

          # Build release notes
          MATCHBOX_TAG="talos-${TALOS_VER}-cozy-${RELEASE_TAG}"
          NOTES=$(cat <<EOF
          ## CozyStack ARM64 Talos Release ${RELEASE_TAG}

          **CozyStack upstream:** \`${COZYSTACK_VER}\`
          **Talos version:** \`${TALOS_VER}\`
          **Architecture:** ARM64 (Raspberry Pi CM4 and compatible boards)
          **Extensions baked in:** Spin runtime only (spin-only variant)

          > The spin-tailscale variant (Spin + Tailscale) is available as an OCI image
          > for use with talm/talosctl but is not included here as a flashable image.

          ### Flashing to Raspberry Pi CM4

          \`\`\`bash
          # Using dd (replace /dev/sdX with your target device)
          xz -dc talos-metal-arm64-spin-only-${MATCHBOX_TAG}.raw.xz | sudo dd of=/dev/sdX bs=4M status=progress

          # Or using Raspberry Pi Imager: select the .raw.xz file as a custom image
          \`\`\`

          ### OCI Images (for talm / talosctl)

          Talos installer (pin by Talos version — same bits regardless of repo release):
          \`\`\`
          ghcr.io/urmanac/cozystack-assets/talos/cozystack-spin-tailscale/talos:${TALOS_VER}
          ghcr.io/urmanac/cozystack-assets/talos/cozystack-spin-only/talos:${TALOS_VER}
          \`\`\`

          Matchbox (pin by composite tag — ties Talos version to CozyStack release):
          \`\`\`
          ghcr.io/urmanac/cozystack-assets/talos/cozystack-spin-tailscale/matchbox:${MATCHBOX_TAG}
          ghcr.io/urmanac/cozystack-assets/talos/cozystack-spin-only/matchbox:${MATCHBOX_TAG}
          \`\`\`

          CozyStack operator (pin by CozyStack release):
          \`\`\`
          ghcr.io/urmanac/cozystack-assets/cozystack-operator:${RELEASE_TAG}
          \`\`\`
          EOF
          )

          gh release create "$RELEASE_TAG" \
            --title "CozyStack ARM64 Talos ${RELEASE_TAG}" \
            --notes "$NOTES" \
            release-artifacts/*
