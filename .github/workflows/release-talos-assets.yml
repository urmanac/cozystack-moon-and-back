name: Release Talos Metal Image

# Triggered when a semver tag is pushed to this repo (e.g. v1.4.0-1.13.2).
# Produces:
#   - talos-metal-arm64.raw.xz  — raw disk image for dd / Raspberry Pi Imager
#   - talos-metal-arm64.raw.xz.sha256  — checksum
# and retags the existing GHCR OCI images with the release tag.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

env:
  REGISTRY: ghcr.io/urmanac/cozystack-assets
  TAG: ${{ github.ref_name }}
  PUBLISH_VERSIONED: '1'
  PUBLISH_FLOATING: '1'

jobs:
  validate-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run patch validation suite
        run: |
          chmod +x validate-patch.sh
          ./validate-patch.sh

  # Stage 1: Build general Cozystack packages in parallel to seed the registry cache.
  build-cozystack-packages:
    needs: [validate-patches]
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        group: [apps, system-base, system-net, system-cloud]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then CRANE_ARCH="x86_64"; else CRANE_ARCH="arm64"; fi
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz | sudo tar xz -C /usr/local/bin crane
          if [ "$ARCH" = "x86_64" ]; then HELM_ARCH="amd64"; else HELM_ARCH="arm64"; fi
          curl -sSL "https://get.helm.sh/helm-v3.16.4-linux-${HELM_ARCH}.tar.gz" | tar xz
          sudo mv linux-${HELM_ARCH}/helm /usr/local/bin/helm
          rm -rf linux-${HELM_ARCH}
          if [ "$ARCH" = "x86_64" ]; then YQ_ARCH="amd64"; else YQ_ARCH="arm64"; fi
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH} -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone upstream CozyStack
        run: |
          COZYSTACK_REF=$(grep -oP "default: '(v[0-9]+\.[0-9]+\.[0-9]+)'" \
            .github/workflows/build-talos-images.yml | head -1 | grep -oP "v[0-9]+\.[0-9]+\.[0-9]+")
          git clone --branch "$COZYSTACK_REF" --depth 1 \
            https://github.com/cozystack/cozystack.git cozystack-upstream

      - name: Apply ARM64 patches
        run: |
          cd cozystack-upstream
          git apply ../patches/04-arm64-default-platform.patch
          git apply ../patches/05-arm64-dashboard.patch
          git apply ../patches/06-kubeovn-manifest-list-retag.patch
          git apply ../patches/07-arm64-skip-amd64-only-builds.patch
          git apply ../patches/11-fix-tagging-logic.patch
          git apply ../patches/14-arm64-linstor.patch

      - name: Build parallel package group
        run: |
          cd cozystack-upstream
          GROUP="${{ matrix.group }}"
          export PUSH=1
          export TAG="${{ github.ref_name }}"
          
          if [ "$GROUP" = "apps" ]; then
            DIRS="packages/apps/http-cache packages/apps/mariadb packages/apps/clickhouse packages/apps/kubernetes packages/system/dashboard"
          elif [ "$GROUP" = "system-base" ]; then
            DIRS="packages/system/monitoring packages/system/cozystack-api packages/system/cozystack-controller packages/system/backup-controller packages/system/backupstrategy-controller packages/system/lineage-controller-webhook packages/system/linstor packages/system/linstor-gui"
          elif [ "$GROUP" = "system-net" ]; then
            DIRS="packages/system/cilium packages/system/kubeovn packages/system/kubeovn-webhook packages/system/kubeovn-plunger"
          elif [ "$GROUP" = "system-cloud" ]; then
            DIRS="packages/system/metallb packages/system/kamaji packages/system/multus packages/system/bucket packages/system/objectstorage-controller packages/system/grafana-operator packages/core/testing packages/core/platform"
          fi

          for d in $DIRS; do
            echo "Building $d..."
            make -C "$d" image REGISTRY="${{ env.REGISTRY }}"
          done

  # Stage 2: Finalize the operator.
  build-cozystack-operator:
    needs: [build-cozystack-packages]
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then CRANE_ARCH="x86_64"; else CRANE_ARCH="arm64"; fi
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz | sudo tar xz -C /usr/local/bin crane
          if [ "$ARCH" = "x86_64" ]; then HELM_ARCH="amd64"; else HELM_ARCH="arm64"; fi
          curl -sSL "https://get.helm.sh/helm-v3.16.4-linux-${HELM_ARCH}.tar.gz" | tar xz
          sudo mv linux-${HELM_ARCH}/helm /usr/local/bin/helm
          rm -rf linux-${HELM_ARCH}
          if [ "$ARCH" = "x86_64" ]; then YQ_ARCH="amd64"; else YQ_ARCH="arm64"; fi
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH} -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
          FLUX_VERSION=$(curl -sSL https://api.github.com/repos/fluxcd/flux2/releases \
            | jq -r '[.[] | select(.tag_name | startswith("v2.7.")) | .tag_name] | first')
          if [ -z "$FLUX_VERSION" ]; then FLUX_VERSION="v2.7.0"; fi
          if [ "$ARCH" = "x86_64" ]; then FLUX_ARCH="amd64"; else FLUX_ARCH="arm64"; fi
          curl -sSL "https://github.com/fluxcd/flux2/releases/download/${FLUX_VERSION}/flux_${FLUX_VERSION#v}_linux_${FLUX_ARCH}.tar.gz" | sudo tar xz -C /usr/local/bin flux

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone upstream CozyStack
        run: |
          COZYSTACK_REF=$(grep -oP "default: '(v[0-9]+\.[0-9]+\.[0-9]+)'" \
            .github/workflows/build-talos-images.yml | head -1 | grep -oP "v[0-9]+\.[0-9]+\.[0-9]+")
          git clone --branch "$COZYSTACK_REF" --depth 1 \
            https://github.com/cozystack/cozystack.git cozystack-upstream

      - name: Apply ARM64 patches
        run: |
          cd cozystack-upstream
          git apply ../patches/04-arm64-default-platform.patch
          git apply ../patches/05-arm64-dashboard.patch
          git apply ../patches/06-kubeovn-manifest-list-retag.patch
          git apply ../patches/07-arm64-skip-amd64-only-builds.patch
          git apply ../patches/11-fix-tagging-logic.patch
          git apply ../patches/14-arm64-linstor.patch

      - name: Build operator and manifests
        run: |
          cd cozystack-upstream
          make -C packages/core/installer image REGISTRY="${{ env.REGISTRY }}" PUSH=1 TAG="${{ github.ref_name }}"

  # Stage 3: per-variant talos installer + matchbox images.
  build-talos-variants:
    needs: [build-cozystack-operator]
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        extension_variant: [spin-tailscale, spin-hailort, spin-only]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then CRANE_ARCH="x86_64"; else CRANE_ARCH="arm64"; fi
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz \
            | sudo tar xz -C /usr/local/bin crane
          if [ "$ARCH" = "x86_64" ]; then YQ_ARCH="amd64"; else YQ_ARCH="arm64"; fi
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH} -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone upstream CozyStack
        run: |
          COZYSTACK_REF=$(grep -oP "default: '(v[0-9]+\.[0-9]+\.[0-9]+)'" \
            .github/workflows/build-talos-images.yml | head -1 | grep -oP "v[0-9]+\.[0-9]+\.[0-9]+")
          git clone --branch "$COZYSTACK_REF" --depth 1 \
            https://github.com/cozystack/cozystack.git cozystack-upstream

      - name: Apply ARM64 + variant patches
        run: |
          cd cozystack-upstream
          bash ../hack/patch-talos.sh "${{ matrix.extension_variant }}"

      - name: Build and push talos + matchbox
        run: |
          cd cozystack-upstream/packages/core/talos
          
          # Parse version from tag
          FULL_TAG="${{ github.ref_name }}"
          if [[ "$FULL_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-(1\.[0-9]+\.[0-9]+)(-.*)?$ ]]; then
            TALOS_VER="v${BASH_REMATCH[2]}"
          else
            UPSTREAM_TALOS_VERSION=$(awk '/^version:/ {print $2; exit}' images/talos/profiles/installer.yaml)
            TALOS_VER="$UPSTREAM_TALOS_VERSION"
          fi
          
          # Inject custom signed sovereign OS images from registry
          export INSTALLER_IMAGE="ghcr.io/urmanac/cozystack-assets/yebyen/installer:5.3.0-${TALOS_VER}"
          export IMAGER_IMAGE="ghcr.io/urmanac/cozystack-assets/yebyen/imager:5.3.0-${TALOS_VER}"
          export DRBD_IMAGE="ghcr.io/urmanac/cozystack-assets/yebyen/drbd:5.3.0-${TALOS_VER}"
          export ZFS_IMAGE="ghcr.io/urmanac/cozystack-assets/yebyen/zfs:5.3.0-${TALOS_VER}"
          export HAILORT_IMAGE="ghcr.io/urmanac/cozystack-assets/yebyen/hailort:5.3.0-${TALOS_VER}"

          bash hack/gen-profiles.sh "$TALOS_VER"
          VARIANT_REGISTRY="${{ env.REGISTRY }}/talos/cozystack-${{ matrix.extension_variant }}"

          make image-talos REGISTRY="$VARIANT_REGISTRY"
          make image-matchbox REGISTRY="$VARIANT_REGISTRY" PUSH=1

  # Stage 4: Generate flashable metal images.
  build-metal-image:
    needs: [build-cozystack-operator, build-talos-variants]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq xz-utils
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then CRANE_ARCH="x86_64"; else CRANE_ARCH="arm64"; fi
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz \
            | sudo tar xz -C /usr/local/bin crane
          if [ "$ARCH" = "x86_64" ]; then YQ_ARCH="amd64"; else YQ_ARCH="arm64"; fi
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH} -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Clone upstream CozyStack
        run: |
          COZYSTACK_REF=$(grep -oP "default: '(v[0-9]+\.[0-9]+\.[0-9]+)'" \
            .github/workflows/build-talos-images.yml | head -1 | grep -oP "v[0-9]+\.[0-9]+\.[0-9]+")
          git clone --branch "$COZYSTACK_REF" --depth 1 \
            https://github.com/cozystack/cozystack.git cozystack-upstream

      - name: Apply spin-hailort ARM64 patches
        run: |
          cd cozystack-upstream
          bash ../hack/patch-talos.sh spin-hailort

      - name: Build Talos metal image
        run: |
          cd cozystack-upstream/packages/core/talos
          FULL_TAG="${{ github.ref_name }}"
          if [[ "$FULL_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-(1\.[0-9]+\.[0-9]+)(-.*)?$ ]]; then
            TALOS_VER="v${BASH_REMATCH[2]}"
          else
            UPSTREAM_TALOS_VERSION=$(awk '/^version:/ {print $2; exit}' images/talos/profiles/installer.yaml)
            TALOS_VER="$UPSTREAM_TALOS_VERSION"
          fi
          
          # Inject custom signed sovereign OS images from registry
          export INSTALLER_IMAGE="ghcr.io/urmanac/cozystack-assets/yebyen/installer:5.3.0-${TALOS_VER}"
          export IMAGER_IMAGE="ghcr.io/urmanac/cozystack-assets/yebyen/imager:5.3.0-${TALOS_VER}"
          export DRBD_IMAGE="ghcr.io/urmanac/cozystack-assets/yebyen/drbd:5.3.0-${TALOS_VER}"
          export ZFS_IMAGE="ghcr.io/urmanac/cozystack-assets/yebyen/zfs:5.3.0-${TALOS_VER}"
          export HAILORT_IMAGE="ghcr.io/urmanac/cozystack-assets/yebyen/hailort:5.3.0-${TALOS_VER}"

          bash hack/gen-profiles.sh "$TALOS_VER"
          echo "TALOS_VERSION=$(awk '/^version:/ {print $2; exit}' images/talos/profiles/metal.yaml)" >> $GITHUB_ENV
          make assets

      - name: Collect release artifacts
        run: |
          FULL_TAG="${{ github.ref_name }}"
          if [[ "$FULL_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-(1\.[0-9]+\.[0-9]+)(-.*)?$ ]]; then
            COZY_VER="${BASH_REMATCH[1]}"
          else
            COZY_VER="$FULL_TAG"
          fi
          
          # Use consistent naming: talos-<VER>-cozy-<COZY_VER>
          ARTIFACT_VER="talos-${TALOS_VERSION}-cozy-${COZY_VER}"
          echo "ARTIFACT_VER=$ARTIFACT_VER" >> $GITHUB_ENV
          mkdir -p release-artifacts
          
          cp cozystack-upstream/_out/assets/metal-arm64.raw.xz \
            "release-artifacts/talos-metal-arm64-spin-hailort-${ARTIFACT_VER}.raw.xz"
          cp cozystack-upstream/_out/assets/metal-rpi5-arm64.raw.xz \
            "release-artifacts/talos-metal-rpi5-arm64-spin-hailort-${ARTIFACT_VER}.raw.xz" 2>/dev/null || true
          cp cozystack-upstream/_out/assets/nocloud-arm64.raw.xz \
            "release-artifacts/talos-nocloud-arm64-spin-hailort-${ARTIFACT_VER}.raw.xz" 2>/dev/null || true
          
          # Netboot assets for RPi5
          if [ -f cozystack-upstream/_out/assets/rpi5-kernel-arm64 ]; then
            cp cozystack-upstream/_out/assets/rpi5-kernel-arm64 "release-artifacts/talos-kernel-rpi5-arm64-spin-hailort-${ARTIFACT_VER}"
          fi
          if [ -f cozystack-upstream/_out/assets/rpi5-initramfs-metal-arm64.xz ]; then
            cp cozystack-upstream/_out/assets/rpi5-initramfs-metal-arm64.xz "release-artifacts/talos-initramfs-rpi5-arm64-spin-hailort-${ARTIFACT_VER}.xz"
          fi

          cd release-artifacts && sha256sum * > SHA256SUMS

      - name: Tag GHCR OCI images at release
        run: |
          FULL_TAG="${{ github.ref_name }}"
          if [[ "$FULL_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-(1\.[0-9]+\.[0-9]+)(-.*)?$ ]]; then
            COZY_VER="${BASH_REMATCH[1]}"
          else
            COZY_VER="$FULL_TAG"
          fi
          
          MATCHBOX_CANONICAL_TAG="${TALOS_VERSION}-${COZY_VER}"
          MATCHBOX_TAG="talos-${TALOS_VERSION}-cozy-${COZY_VER}"
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            --username ${{ github.actor }} --password-stdin

          # Promote all Cozystack packages to 'latest'
          PACKAGES=(
            "http-cache" "mariadb" "clickhouse" "kubernetes"
            "monitoring" "cozystack-api" "cozystack-controller" "backup-controller" "backupstrategy-controller" "lineage-controller-webhook"
            "cilium" "kubeovn" "kubeovn-webhook" "kubeovn-plunger"
            "cozystack-ui" "token-proxy"
            "piraeus-server" "linstor-csi" "linstor-gui"
            "metallb" "kamaji" "multus" "bucket" "objectstorage-controller" "grafana-operator" "testing" "platform"
          )
          for PKG in "${PACKAGES[@]}"; do
            SRC="${{ env.REGISTRY }}/${PKG}:${FULL_TAG}"
            docker buildx imagetools create --tag "${{ env.REGISTRY }}/${PKG}:${COZY_VER}" "${SRC}" || true
            docker buildx imagetools create --tag "${{ env.REGISTRY }}/${PKG}:latest" "${SRC}" || true
          done

          # Promote Talos and Matchbox images
          for VARIANT in spin-tailscale spin-hailort spin-only; do
            BASE="${{ env.REGISTRY }}/talos/cozystack-${VARIANT}"
            
            # Matchbox
            SRC_MB="${BASE}/matchbox:${MATCHBOX_CANONICAL_TAG}"
            docker buildx imagetools create --tag "${BASE}/matchbox:${MATCHBOX_TAG}" "${SRC_MB}" || true
            docker buildx imagetools create --tag "${BASE}/matchbox:latest" "${SRC_MB}" || true
            
            # Installer (Generic)
            SRC_TALOS="${BASE}/talos:${TALOS_VERSION}"
            docker buildx imagetools create --tag "${BASE}/talos:latest" "${SRC_TALOS}" || true
            
            # Specialized RPi5
            if [ "$VARIANT" = "spin-hailort" ]; then
              # RPi5 Matchbox
              SRC_MB_RPI5="${BASE}/matchbox:${MATCHBOX_CANONICAL_TAG}-rpi5"
              docker buildx imagetools create --tag "${BASE}/matchbox:${MATCHBOX_TAG}-rpi5" "${SRC_MB_RPI5}" || true
              docker buildx imagetools create --tag "${BASE}/matchbox:latest-rpi5" "${SRC_MB_RPI5}" || true
              
              # RPi5 Installer
              SRC_TALOS_RPI5="${BASE}/talos:${TALOS_VERSION}-rpi5"
              docker buildx imagetools create --tag "${BASE}/talos:latest-rpi5" "${SRC_TALOS_RPI5}" || true
            fi
          done

          OPERATOR_SRC="${{ env.REGISTRY }}/cozystack-operator:${FULL_TAG}"
          docker buildx imagetools create --tag "${{ env.REGISTRY }}/cozystack-operator:${COZY_VER}" "${OPERATOR_SRC}" || true
          docker buildx imagetools create --tag "${{ env.REGISTRY }}/cozystack-operator:latest" "${OPERATOR_SRC}" || true

      - name: Verify Release Provenance
        run: |
          FULL_TAG="${{ github.ref_name }}"
          bash tests/custom-image/05-release-provenance.sh "${FULL_TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FULL_TAG="${{ github.ref_name }}"
          if [[ "$FULL_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-(1\.[0-9]+\.[0-9]+)(-.*)?$ ]]; then
            COZY_VER="${BASH_REMATCH[1]}"
            TALOS_BASE_VER="v${BASH_REMATCH[2]}"
          else
            COZY_VER="$FULL_TAG"
            TALOS_BASE_VER="v1.13.2"
          fi
          
          MATCHBOX_TAG="talos-${TALOS_VERSION}-cozy-${COZY_VER}"
          
          cat > release_notes.md <<EOF
          ## CozyStack ARM64 Talos Release ${FULL_TAG}
          **CozyStack upstream:** \`${COZY_VER}\`
          **Talos version:** \`${TALOS_VERSION}\`
          **Architecture:** ARM64 (Raspberry Pi CM4, CM5 and compatible boards)
          
          ### OCI Images
          #### Talos Installer (Upgrades)
          - **Generic (CM4):** \`ghcr.io/urmanac/cozystack-assets/talos/cozystack-spin-hailort/talos:${TALOS_VERSION}\`
          - **RPi5 (CM5):** \`ghcr.io/urmanac/cozystack-assets/talos/cozystack-spin-hailort/talos:${TALOS_VERSION}-rpi5\`
          
          #### Matchbox (Netboot)
          - **Generic (CM4):** \`ghcr.io/urmanac/cozystack-assets/talos/cozystack-spin-hailort/matchbox:${MATCHBOX_TAG}\`
          - **RPi5 (CM5):** \`ghcr.io/urmanac/cozystack-assets/talos/cozystack-spin-hailort/matchbox:${MATCHBOX_TAG}-rpi5\`
          
          #### Packages
          - **Operator:** \`ghcr.io/urmanac/cozystack-assets/cozystack-operator:${COZY_VER}\`
          - All system packages are tagged with \`${COZY_VER}\` and \`latest\`.
          
          ### Flashable Metal Images
          - **CM4:** \`talos-metal-arm64-spin-hailort-${MATCHBOX_TAG}.raw.xz\`
          - **CM5:** \`talos-metal-rpi5-arm64-spin-hailort-${MATCHBOX_TAG}.raw.xz\`
          
          ### Specialized RPi5 Netboot Assets
          - **Kernel:** \`talos-kernel-rpi5-arm64-spin-hailort-${MATCHBOX_TAG}\`
          - **Initramfs:** \`talos-initramfs-rpi5-arm64-spin-hailort-${MATCHBOX_TAG}.xz\`
          
          ---
          *Verified by Release Provenance Rubric*
          EOF

          sed -i 's/^          //' release_notes.md

          gh release create "$FULL_TAG" \
            --title "CozyStack ARM64 Talos ${FULL_TAG}" \
            --notes-file release_notes.md \
            release-artifacts/*
