name: Release Talos Metal Image

# Triggered when a semver tag is pushed to this repo (e.g. v1.4.0-1.13.2).
# Produces:
#   - talos-metal-arm64.raw.xz  — raw disk image for dd / Raspberry Pi Imager
#   - talos-metal-arm64.raw.xz.sha256  — checksum
# and retags the existing GHCR OCI images with the release tag.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

env:
  REGISTRY: ghcr.io/urmanac/cozystack-assets

jobs:
  # Stage 1: build all in-tree CozyStack images as linux/arm64 and push to our registry.
  build-cozystack-images:
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then CRANE_ARCH="x86_64"; else CRANE_ARCH="arm64"; fi
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz \
            | sudo tar xz -C /usr/local/bin crane
          if [ "$ARCH" = "x86_64" ]; then HELM_ARCH="amd64"; else HELM_ARCH="arm64"; fi
          curl -sSL "https://get.helm.sh/helm-v3.16.4-linux-${HELM_ARCH}.tar.gz" | tar xz
          sudo mv linux-${HELM_ARCH}/helm /usr/local/bin/helm
          rm -rf linux-${HELM_ARCH}
          if [ "$ARCH" = "x86_64" ]; then YQ_ARCH="amd64"; else YQ_ARCH="arm64"; fi
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH} -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
          FLUX_VERSION=$(curl -sSL https://api.github.com/repos/fluxcd/flux2/releases \
            | jq -r '[.[] | select(.tag_name | startswith("v2.7.")) | .tag_name] | first')
          if [ -z "$FLUX_VERSION" ]; then FLUX_VERSION="v2.7.0"; fi
          if [ "$ARCH" = "x86_64" ]; then FLUX_ARCH="amd64"; else FLUX_ARCH="arm64"; fi
          curl -sSL "https://github.com/fluxcd/flux2/releases/download/${FLUX_VERSION}/flux_${FLUX_VERSION#v}_linux_${FLUX_ARCH}.tar.gz" \
            | sudo tar xz -C /usr/local/bin flux

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone upstream CozyStack
        run: |
          # Use the default commit pinned in the main build workflow
          COZYSTACK_REF=$(grep -oP "default: '(v[0-9]+\.[0-9]+\.[0-9]+)'" \
            .github/workflows/build-talos-images.yml | head -1 | grep -oP "v[0-9]+\.[0-9]+\.[0-9]+")
          echo "Building CozyStack images from $COZYSTACK_REF"
          git clone --branch "$COZYSTACK_REF" --depth 1 \
            https://github.com/cozystack/cozystack.git cozystack-upstream

      - name: Apply ARM64 patches (shared build)
        run: |
          cd cozystack-upstream
          git apply ../patches/04-arm64-default-platform.patch
          git apply ../patches/06-kubeovn-manifest-list-retag.patch
          git apply ../patches/07-arm64-skip-amd64-only-builds.patch

      - name: Build all in-tree images (make build)
        run: |
          cd cozystack-upstream
          # Normal build (uses default TAG from Makefile, e.g. v1.4.0)
          make build REGISTRY="${{ env.REGISTRY }}" PUSH=1

  # Stage 2: per-variant talos installer + matchbox images.
  build-talos-variants:
    needs: [build-cozystack-images]
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        extension_variant: [spin-tailscale, spin-hailort, spin-only]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then CRANE_ARCH="x86_64"; else CRANE_ARCH="arm64"; fi
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz \
            | sudo tar xz -C /usr/local/bin crane
          if [ "$ARCH" = "x86_64" ]; then YQ_ARCH="amd64"; else YQ_ARCH="arm64"; fi
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH} -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone upstream CozyStack
        run: |
          COZYSTACK_REF=$(grep -oP "default: '(v[0-9]+\.[0-9]+\.[0-9]+)'" \
            .github/workflows/build-talos-images.yml | head -1 | grep -oP "v[0-9]+\.[0-9]+\.[0-9]+")
          git clone --branch "$COZYSTACK_REF" --depth 1 \
            https://github.com/cozystack/cozystack.git cozystack-upstream

      - name: Apply ARM64 + variant patches
        run: |
          cd cozystack-upstream
          EXTENSION_VARIANT="${{ matrix.extension_variant }}"
          git apply ../patches/04-arm64-default-platform.patch
          if [ "$EXTENSION_VARIANT" = "spin-only" ]; then
            git apply ../patches/03-arm64-spin-only.patch
          elif [ "$EXTENSION_VARIANT" = "spin-hailort" ]; then
            git apply ../patches/08-arm64-spin-hailort.patch
          else
            git apply ../patches/01-arm64-spin-tailscale.patch
          fi
          git apply ../patches/02-makefile-architecture-variables.patch
          chmod +x packages/core/talos/hack/gen-profiles.sh
          chmod +x packages/core/talos/hack/gen-versions.sh

      - name: Build and push talos + matchbox
        run: |
          cd cozystack-upstream/packages/core/talos
          
          # Parse version from tag
          FULL_TAG="${{ github.ref_name }}"
          if [[ "$FULL_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-(1\.[0-9]+\.[0-9]+)$ ]]; then
            TALOS_VER="v${BASH_REMATCH[2]}"
          else
            UPSTREAM_TALOS_VERSION=$(awk '/^version:/ {print $2; exit}' images/talos/profiles/installer.yaml)
            TALOS_VER="$UPSTREAM_TALOS_VERSION"
          fi
          
          bash hack/gen-profiles.sh "$TALOS_VER"
          VARIANT_REGISTRY="${{ env.REGISTRY }}/talos/cozystack-${{ matrix.extension_variant }}"

          make image-talos REGISTRY="$VARIANT_REGISTRY"
          make image-matchbox REGISTRY="$VARIANT_REGISTRY" PUSH=1

  build-metal-image:
    needs: [build-cozystack-images, build-talos-variants]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq xz-utils
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then CRANE_ARCH="x86_64"; else CRANE_ARCH="arm64"; fi
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz \
            | sudo tar xz -C /usr/local/bin crane
          if [ "$ARCH" = "x86_64" ]; then YQ_ARCH="amd64"; else YQ_ARCH="arm64"; fi
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH} -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Clone upstream CozyStack
        run: |
          COZYSTACK_REF=$(grep -oP "default: '(v[0-9]+\.[0-9]+\.[0-9]+)'" \
            .github/workflows/build-talos-images.yml | head -1 | grep -oP "v[0-9]+\.[0-9]+\.[0-9]+")
          git clone --branch "$COZYSTACK_REF" --depth 1 \
            https://github.com/cozystack/cozystack.git cozystack-upstream

      - name: Apply spin-only ARM64 patches
        run: |
          cd cozystack-upstream
          git apply ../patches/04-arm64-default-platform.patch
          git apply ../patches/03-arm64-spin-only.patch
          git apply ../patches/02-makefile-architecture-variables.patch
          chmod +x packages/core/talos/hack/gen-profiles.sh
          chmod +x packages/core/talos/hack/gen-versions.sh

      - name: Build Talos metal image
        run: |
          cd cozystack-upstream/packages/core/talos
          FULL_TAG="${{ github.ref_name }}"
          if [[ "$FULL_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-(1\.[0-9]+\.[0-9]+)$ ]]; then
            TALOS_VER="v${BASH_REMATCH[2]}"
          else
            UPSTREAM_TALOS_VERSION=$(awk '/^version:/ {print $2; exit}' images/talos/profiles/installer.yaml)
            TALOS_VER="$UPSTREAM_TALOS_VERSION"
          fi
          
          bash hack/gen-profiles.sh "$TALOS_VER"
          echo "TALOS_VERSION=$(awk '/^version:/ {print $2; exit}' images/talos/profiles/metal.yaml)" >> $GITHUB_ENV
          make assets

      - name: Collect release artifacts
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          ARTIFACT_VER="talos-${TALOS_VERSION}-cozy-${RELEASE_TAG}"
          mkdir -p release-artifacts
          cp cozystack-upstream/_out/assets/metal-arm64.raw.xz \
            "release-artifacts/talos-metal-arm64-spin-only-${ARTIFACT_VER}.raw.xz"
          cp cozystack-upstream/_out/assets/nocloud-arm64.raw.xz \
            "release-artifacts/talos-nocloud-arm64-spin-only-${ARTIFACT_VER}.raw.xz" 2>/dev/null || true
          cd release-artifacts && sha256sum * > SHA256SUMS

      - name: Tag GHCR OCI images at release
        run: |
          FULL_TAG="${{ github.ref_name }}"
          if [[ "$FULL_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-(1\.[0-9]+\.[0-9]+)$ ]]; then
            COZY_VER="${BASH_REMATCH[1]}"
          else
            COZY_VER="$FULL_TAG"
          fi
          
          MATCHBOX_CANONICAL_TAG="${TALOS_VERSION}-${COZY_VER}"
          MATCHBOX_TAG="talos-${TALOS_VERSION}-cozy-${COZY_VER}"
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            --username ${{ github.actor }} --password-stdin

          for VARIANT in spin-tailscale spin-hailort spin-only; do
            BASE="${{ env.REGISTRY }}/talos/cozystack-${VARIANT}"
            SRC="${BASE}/matchbox:${MATCHBOX_CANONICAL_TAG}"
            docker buildx imagetools create --tag "${BASE}/matchbox:${MATCHBOX_TAG}" "${SRC}" || true
            docker buildx imagetools create --tag "${BASE}/matchbox:latest" "${SRC}" || true
          done

          OPERATOR_SRC="${{ env.REGISTRY }}/cozystack-operator:${COZY_VER}"
          docker buildx imagetools create --tag "${{ env.REGISTRY }}/cozystack-operator:latest" "${OPERATOR_SRC}" || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FULL_TAG="${{ github.ref_name }}"
          if [[ "$FULL_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-(1\.[0-9]+\.[0-9]+)$ ]]; then
            COZY_VER="${BASH_REMATCH[1]}"
          else
            COZY_VER="$FULL_TAG"
          fi
          
          TALOS_VER="${TALOS_VERSION}"
          MATCHBOX_TAG="talos-${TALOS_VER}-cozy-${COZY_VER}"
          
          NOTES=$(cat <<EOF
          ## CozyStack ARM64 Talos Release ${FULL_TAG}
          **CozyStack upstream:** \`${COZY_VER}\`
          **Talos version:** \`${TALOS_VER}\`
          **Architecture:** ARM64 (Raspberry Pi CM4 and compatible boards)
          **Extensions baked in:** Spin runtime (all variants), Tailscale (spin-tailscale), HailoRT (spin-hailort)
          
          ### Flashing to Raspberry Pi CM4
          \`\`\`bash
          xz -dc talos-metal-arm64-spin-only-${MATCHBOX_TAG}.raw.xz | sudo dd of=/dev/sdX bs=4M status=progress
          \`\`\`
          
          ### OCI Images
          Talos installer:
          - ghcr.io/urmanac/cozystack-assets/talos/cozystack-spin-tailscale/talos:${TALOS_VER}
          - ghcr.io/urmanac/cozystack-assets/talos/cozystack-spin-hailort/talos:${TALOS_VER}
          - ghcr.io/urmanac/cozystack-assets/talos/cozystack-spin-only/talos:${TALOS_VER}
          
          Matchbox:
          - ghcr.io/urmanac/cozystack-assets/talos/cozystack-spin-tailscale/matchbox:${MATCHBOX_TAG}
          - ghcr.io/urmanac/cozystack-assets/talos/cozystack-spin-hailort/matchbox:${MATCHBOX_TAG}
          - ghcr.io/urmanac/cozystack-assets/talos/cozystack-spin-only/matchbox:${MATCHBOX_TAG}
          
          CozyStack operator:
          - ghcr.io/urmanac/cozystack-assets/cozystack-operator:${COZY_VER}
          EOF
          )

          gh release create "$FULL_TAG" \
            --title "CozyStack ARM64 Talos ${FULL_TAG}" \
            --notes "$NOTES" \
            release-artifacts/*
