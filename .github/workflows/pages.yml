name: Deploy GitHub Pages

on:
  # Rebuild site for content/theme changes.
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'assets/**'
      - '_config.yml'
      - '_config-local.yml'
      - 'index.md'
      - 'Gemfile'
      - '.github/workflows/pages.yml'

  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'assets/**'
      - '_config.yml'
      - '_config-local.yml'
      - 'index.md'
      - 'Gemfile'
      - '.github/workflows/pages.yml'

  # Rebuild site after the ARM64 build workflow updates docs/LATEST-BUILD.md.
  workflow_run:
    workflows: ["Build CozyStack ARM64 Images (Upstream Integration)"]
    types: [completed]
    branches: [ main ]
  
  # Allow manual trigger
  workflow_dispatch:

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_run, build from latest main so docs updates from update-docs are included.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 1
          
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
        
      - name: Build site
        run: |
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main')
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5